[package]
name = "rs_diffcopy"
version = "1.0.0"
edition = "2024"
authors = ["kznagamori"]
description = "A tool to compare two directories and extract only the files with differences while maintaining the directory structure"
license = "MIT"
repository = "https://github.com/kznagamori/rs_diffcopy"
keywords = ["diff", "copy", "directory", "compare"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
glob = "0.3"
chrono = "0.4"
anyhow = "1"
blake3 = "1"
similar = "2"
rust_xlsxwriter = "0.92"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rayon = "1.10"
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
calamine = "0.26"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
