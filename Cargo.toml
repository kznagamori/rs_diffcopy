[package]
name = "rs_diffcopy"
version = "1.0.0"
edition = "2024"
authors = ["kznagamori"]
description = "A tool to compare directories and extract diff files with preserved structure"
license = "MIT"
repository = "https://github.com/kznagamori/rs_diffcopy"
homepage = "https://github.com/kznagamori/rs_diffcopy"
readme = "README.md"
keywords = ["diff", "directory", "compare", "copy", "three-way"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
# CLI parsing
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# File hashing
blake3 = "1"

# Glob pattern matching
glob = "0.3"
globset = "0.4"

# Directory traversal
walkdir = "2"

# Parallel processing
rayon = "1"

# Progress bar
indicatif = "0.17"

# Colored output
colored = "2"

# Excel output
rust_xlsxwriter = "0.92"

# Date/time
chrono = "0.4"

# Diff generation
similar = "2"

# Error handling
anyhow = "1"
thiserror = "1"

# Unicode width for Japanese characters
unicode-width = "0.2"

# File timestamp preservation
filetime = "0.2"

# Cross-platform terminal handling
crossterm = "0.28"

# Determine if stdout is a terminal
is-terminal = "0.4"

# Character encoding (for Windows CP932 output)
encoding_rs = "0.8"

# Windows API for console output
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "fileapi", "winbase", "winnt", "minwindef"] }

[dev-dependencies]
tempfile = "3"
calamine = "0.26"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
